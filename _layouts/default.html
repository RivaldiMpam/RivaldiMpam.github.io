<!-- CSS UNTUK NAVBAR MODERN -->
<style>
  :root {
    --nav-bg-light: rgba(255, 255, 255, 0.95);
    --nav-bg-dark: rgba(24, 28, 36, 0.95);
    --nav-text-light: #2c3e50;
    --nav-text-dark: #f5f6fa;
    --nav-accent: #2ecc71; /* Warna hijau alam/geomatika */
    --nav-border-light: rgba(0, 0, 0, 0.08);
    --nav-border-dark: rgba(255, 255, 255, 0.08);
  }

  /* Reset navbar container */
  .custom-navbar {
    position: sticky;
    top: 0;
    z-index: 1000;
    width: 100%;
    background-color: var(--nav-bg-light);
    border-bottom: 1px solid var(--nav-border-light);
    backdrop-filter: blur(8px);
    transition: all 0.3s ease;
  }

  /* Jika beralih ke dark mode (bisa disesuaikan dengan class body di jekyll kamu, misal .dark-theme) */
  body.dark-theme .custom-navbar {
    background-color: var(--nav-bg-dark);
    border-bottom: 1px solid var(--nav-border-dark);
  }

  .nav-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* Brand Styling */
  .nav-brand {
    text-decoration: none;
    display: flex;
    flex-direction: column;
    color: inherit;
  }
  .brand-name {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--nav-text-light);
  }
  body.dark-theme .brand-name {
    color: var(--nav-text-dark);
  }
  .brand-sub {
    font-size: 0.75rem;
    color: #7f8c8d;
    margin-top: 1px;
  }

  /* Menu & Link Styling */
  .nav-menu-wrapper {
    display: flex;
    align-items: center;
    gap: 32px;
  }

  .nav-menu {
    list-style: none;
    display: flex;
    align-items: center;
    gap: 24px;
    margin: 0;
    padding: 0;
  }

  .nav-link {
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 500;
    color: #64748b;
    padding: 6px 12px;
    border-radius: 6px;
    transition: all 0.2s ease;
  }

  .nav-link:hover, .nav-link.active {
    color: var(--nav-accent);
    background-color: rgba(46, 204, 113, 0.08);
  }

  /* Actions (Language & Theme) */
  .nav-actions {
    display: flex;
    align-items: center;
    gap: 16px;
    border-left: 1px solid var(--nav-border-light);
    padding-left: 16px;
  }
  body.dark-theme .nav-actions {
    border-left: 1px solid var(--nav-border-dark);
  }

  .lang-selector {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
  }

  .lang-btn {
    text-decoration: none;
    color: #94a3b8;
    font-weight: 600;
    transition: color 0.2s ease;
  }

  .lang-btn.active, .lang-btn:hover {
    color: var(--nav-text-light);
  }
  body.dark-theme .lang-btn.active, body.dark-theme .lang-btn:hover {
    color: var(--nav-text-dark);
  }

  .lang-divider {
    color: #cbd5e1;
    font-size: 0.75rem;
  }

  /* Theme Toggle Button */
  .theme-toggle {
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px;
    border-radius: 50%;
    color: #64748b;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.2s, color 0.2s;
  }

  .theme-toggle:hover {
    background-color: rgba(0, 0, 0, 0.05);
    color: var(--nav-accent);
  }
  body.dark-theme .theme-toggle:hover {
    background-color: rgba(255, 255, 255, 0.05);
  }

  .sun-icon {
    width: 20px;
    height: 20px;
  }

  /* Hamburger Button */
  .nav-toggle {
    display: none;
    flex-direction: column;
    justify-content: space-between;
    width: 22px;
    height: 18px;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0;
  }

  .nav-toggle .bar {
    width: 100%;
    height: 2px;
    background-color: var(--nav-text-light);
    transition: all 0.3s ease;
  }
  body.dark-theme .nav-toggle .bar {
    background-color: var(--nav-text-dark);
  }

  /* RESPONSIVE DESIGN (MOBILE & TABLET) */
  @media (max-width: 768px) {
    .nav-toggle {
      display: flex;
    }

    .nav-menu-wrapper {
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      background-color: var(--nav-bg-light);
      border-bottom: 1px solid var(--nav-border-light);
      flex-direction: column;
      align-items: flex-start;
      gap: 20px;
      padding: 24px;
      box-sizing: border-box;
      display: none; /* disembunyikan secara default */
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
    }
    body.dark-theme .nav-menu-wrapper {
      background-color: var(--nav-bg-dark);
      border-bottom: 1px solid var(--nav-border-dark);
    }

    .nav-menu-wrapper.show {
      display: flex;
    }

    .nav-menu {
      flex-direction: column;
      align-items: flex-start;
      width: 100%;
      gap: 16px;
    }

    .nav-link {
      display: block;
      width: 100%;
      padding: 8px 12px;
    }

    .nav-actions {
      border-left: none;
      border-top: 1px solid var(--nav-border-light);
      padding-left: 0;
      padding-top: 16px;
      width: 100%;
      justify-content: space-between;
    }
    body.dark-theme .nav-actions {
      border-top: 1px solid var(--nav-border-dark);
    }

    /* Animasi hamburger jadi silang (X) */
    .nav-toggle.open .bar:nth-child(1) {
      transform: translateY(8px) rotate(45deg);
    }
    .nav-toggle.open .bar:nth-child(2) {
      opacity: 0;
    }
    .nav-toggle.open .bar:nth-child(3) {
      transform: translateY(-8px) rotate(-45deg);
    }
  }
</style>

<!-- JAVASCRIPT UNTUK HAMBURGER MENU -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const navToggle = document.getElementById('navToggle');
    const navMenuWrapper = document.getElementById('navMenuWrapper');

    // Toggle menu mobile
    navToggle.addEventListener('click', () => {
      navToggle.classList.toggle('open');
      navMenuWrapper.classList.toggle('show');
    });

    // Menutup menu jika mengklik di luar area navbar
    document.addEventListener('click', (e) => {
      if (!navToggle.contains(e.target) && !navMenuWrapper.contains(e.target)) {
        navToggle.classList.remove('open');
        navMenuWrapper.classList.remove('show');
      }
    });
  </script>
