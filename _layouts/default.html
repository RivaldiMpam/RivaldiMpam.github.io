<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} - Rivaldi Fiqriyansah</title>
  <link rel="icon" href="/favicon_RF.png">
  <link rel="shortcut icon" href="/favicon_RF.png">
  
  <style>
    :root {
      --bg-color: #1a1a1a;
      --text-color: #f0f0f0;
      --link-color: #ff80bf;
      --bg-image: linear-gradient(rgba(26, 26, 26, 0.85), rgba(26, 26, 26, 0.9)), url('/images/background-utama.jpg'); 
    }
    
    body.light-mode {
      --bg-color: #ffffff;
      --text-color: #333333;
      --link-color: #e83e8c;
      --bg-image: linear-gradient(rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.95)), url('/images/background-utama.jpg');
    }
    
    body {
      background-color: var(--bg-color);
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: background-color 0.3s, color 0.3s, background-image 0.3s;
      max-width: 1100px; /* Diperlebar agar layout lebih lega untuk konten journey/projects */
      margin: 0 auto;
      padding: 20px 20px 40px 20px;
    }

    .navbar {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 40px;
      border-bottom: 1px solid rgba(150, 150, 150, 0.2);
      padding-bottom: 15px;
    }
    
    .navbar a {
      text-decoration: none;
      color: var(--text-color);
      font-size: 16px;
      font-weight: bold;
    }
    
    .navbar a:hover, .navbar a.active {
      color: var(--link-color);
    }
    
    .separator {
      color: var(--text-color);
      font-size: 16px;
    }

    .nav-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-color);
      font-size: 18px;
      margin-left: 15px;
    }

    .lang-select {
      background-color: transparent;
      color: var(--text-color);
      border: 1px solid var(--text-color);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-left: 15px;
    }

    .lang-select option {
      color: #333;
    }

    /* --- STYLE DROPDOWN SOFTWARE MENU --- */
    .nav-dropdown {
      position: relative;
      display: inline-block;
      /* Jembatan tak terlihat biar kursor gak putus */
      padding-bottom: 20px; 
      /* Biar layout navbar gak kegeser karena padding di atas */
      margin-bottom: -20px; 
    }

    .nav-dropbtn {
      background: none;
      color: var(--text-color);
      font-size: 16px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      padding: 0;
      font-family: inherit;
      transition: color 0.3s;
    }

    .nav-dropbtn:hover, .nav-dropdown:hover .nav-dropbtn {
      color: var(--link-color);
    }

    .nav-dropdown-content {
      display: none;
      position: absolute;
      background-color: var(--bg-color);
      min-width: 170px;
      box-shadow: 0px 8px 15px rgba(0,0,0,0.5);
      z-index: 100;
      border-radius: 8px;
      /* Diubah jadi 100% biar nempel ke jembatan */
      top: 100%; 
      left: 50%;
      transform: translateX(-50%);
      overflow: hidden;
      border: 1px solid rgba(150, 150, 150, 0.2);
    }

    .nav-dropdown-content a {
      color: var(--text-color);
      padding: 12px 16px;
      text-decoration: none;
      display: flex;
      align-items: center; /* Memastikan logo dan teks sejajar */
      font-size: 14px;
      border-bottom: 1px solid rgba(150, 150, 150, 0.1);
    }

    .nav-dropdown-content a:last-child {
      border-bottom: none;
    }

    .nav-dropdown-content a:hover {
      background-color: rgba(150, 150, 150, 0.1);
      color: var(--link-color);
    }

    /* Style untuk icon/logo aplikasi */
    .nav-icon {
      width: 18px;
      height: 18px;
      margin-right: 10px;
      object-fit: contain;
    }

    /* Tampilkan dropdown saat kursor berada di atas tulisan software */
    .nav-dropdown:hover .nav-dropdown-content {
      display: block;
      animation: fadeInDrop 0.3s ease;
    }

    @keyframes fadeInDrop {
      from { opacity: 0; transform: translate(-50%, -10px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
  </style>
</head>
<body>
  
  <div class="navbar">
    <a href="/">Home</a> <span class="separator">|</span>
    <a href="/journey/">Journey</a> <span class="separator">|</span>
    <a href="/cv/">Experience</a> <span class="separator">|</span>
    <a href="/projects/">Projects</a> <span class="separator">|</span>
    <a href="/gallery/">Gallery</a> <span class="separator">|</span>
    <a href="/writing/">Writing</a> <span class="separator">|</span>
    
    <!-- DROPDOWN SOFTWARE -->
    <div class="nav-dropdown">
      <button class="nav-dropbtn">Software ▾</button>
      <div class="nav-dropdown-content">
        <!-- Nanti siapkan file gambar icon di dalam folder /images/icons/ -->
        <a href="/software/arcgis/"><img src="/images/icons/arcgis-pro-logo.png" class="nav-icon" alt="ArcGIS">ArcGIS Pro</a>
        <a href="/software/qgis/"><img src="/images/icons/qgis.png" class="nav-icon" alt="QGIS">QGIS</a>
        <a href="/software/gee/"><img src="/images/icons/gee.png" class="nav-icon" alt="GEE">Google Earth Engine</a>
        <a href="/software/rstudio/"><img src="/images/icons/rstudio.png" class="nav-icon" alt="RStudio">RStudio</a>
      </div>
    </div>
    
    <span class="separator">|</span>
    <a href="/contact/">Contact</a>
    
    <select class="lang-select" id="lang-switcher" onchange="changeLanguage()">
      <option value="id">ID</option>
      <option value="en">EN</option>
    </select>

    <button class="nav-btn" onclick="toggleTheme()" title="Ganti Terang/Gelap">🌓</button>
  </div>

  <script>
    // 1. Cek Tema
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') {
      document.body.classList.add('light-mode');
    }

    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
    }

    // 2. Fungsi Eksekusi Ganti Bahasa dari Dropdown
    function changeLanguage() {
      const selectedLang = document.getElementById('lang-switcher').value;
      localStorage.setItem('lang', selectedLang);
      
      let currentPath = window.location.pathname;
      if (selectedLang === 'en' && !currentPath.startsWith('/en/')) {
        window.location.href = '/en' + (currentPath === '/' ? '' : currentPath);
      } else if (selectedLang === 'id' && currentPath.startsWith('/en/')) {
        let newPath = currentPath.replace('/en/', '/');
        window.location.href = newPath === '//' ? '/' : newPath;
      }
    }

    // 3. Pintar Membaca URL dan Update Navigasi
    // Diubah menjadi event listener agar tidak bentrok dengan script di halaman lain
    window.addEventListener('load', function() {
      let currentPath = window.location.pathname;
      let isEnglishUrl = currentPath.startsWith('/en/');

      // Sesuaikan teks dropdown dengan URL
      document.getElementById('lang-switcher').value = isEnglishUrl ? 'en' : 'id';

      // Dinamis mengarahkan link navigasi (termasuk yang di dalam dropdown) 
      // biar tetap stay di bahasa yang sama
      const navLinks = document.querySelectorAll('.navbar a');
      navLinks.forEach(link => {
        let href = link.getAttribute('href');
        
        if (isEnglishUrl && href.startsWith('/') && !href.startsWith('/en/')) {
           // Tambah /en kalau lagi di mode Inggris
           let newHref = '/en' + (href === '/' ? '' : href);
           link.setAttribute('href', newHref);
        }
      });
    });
  </script>

  {{ content }}

</body>
</html>
