---
layout: default
---
<article>
  <section class="article-hero full-bleed" style="background-image: url('{{ page.cover_image }}');">
    <div class="article-hero-content">
      <p class="eyebrow">{{ page.category }}</p>
      <h1>{{ page.title }}</h1>
      <p class="article-meta">{{ page.subtitle }}</p>
    </div>
  </section>

  <div class="section">
    <div class="section-inner">
      <a href="{{ page.back_url | default: '/projects/' }}" class="back-link">&larr; Kembali ke Proyek</a>
      <div class="article-body">
        {{ content }}
      </div>
    </div>
  </div>
</article>
